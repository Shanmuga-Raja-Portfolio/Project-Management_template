name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: RUNFILEs are up to date and within budget
        run: python scripts/build_runfiles.py --check

      - name: Shell scripts parse
        run: |
          status=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || status=1; done
          exit $status

      - name: Minimal starter set passes pmkit check
        run: |
          dir="$RUNNER_TEMP/minimal"
          bash scripts/new-project.sh --minimal --yes "$dir"
          cd "$dir" && python .pmkit/pmkit.py check

      - name: Full starter folder passes pmkit check
        run: |
          dir="$RUNNER_TEMP/full"
          bash scripts/new-project.sh --yes "$dir"
          cd "$dir" && python .pmkit/pmkit.py check

      - name: Installers dry-run
        run: |
          for f in levels/2-starter-tools/installers/*.sh; do
            echo "::group::$f"
            bash "$f" --dry-run < /dev/null
            echo "::endgroup::"
          done
          bash scripts/install-skill.sh --project "$RUNNER_TEMP/full" --dry-run < /dev/null

      - name: Relative Markdown links resolve
        shell: python
        run: |
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              text = re.sub(r"`[^`\n]*`", "", text)
              for target in re.findall(r"\]\(([^)\s]+)", text):
                  path = target.split("#")[0]
                  if path and not re.match(r"[a-z]+:", path) and not (md.parent / path).exists():
                      bad.append("{}: {}".format(md, target))
          print("\n".join(bad) or "All relative links resolve.")
          sys.exit(1 if bad else 0)

  windows:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: PowerShell scripts parse
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { $bad++; Write-Output ("{0}:{1} {2}" -f $_.FullName, $e.Extent.StartLineNumber, $e.Message) }
          }
          if ($bad) { exit 1 }

      - name: Minimal starter set passes pmkit check
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'minimal'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\new-project.ps1 -Minimal -Yes $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $dir
          python .pmkit\pmkit.py check
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Installers dry-run
        run: |
          $failed = 0
          Get-ChildItem levels\2-starter-tools\installers\*.ps1 | ForEach-Object {
            Write-Output "== $($_.Name)"
            powershell -NoProfile -ExecutionPolicy Bypass -File $_.FullName -DryRun
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-skill.ps1 -Project (Join-Path $env:RUNNER_TEMP 'minimal') -DryRun
          if ($LASTEXITCODE -ne 0) { $failed++ }
          if ($failed) { exit 1 }

  # ---- DCO: contributions must be signed off ---------------------------
  signoff:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Check out the PR head, not the synthetic merge commit (which has
          # no Signed-off-by and would fail every PR).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit is signed off
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          bad=$(git log --format='%H%x00%B%x00END%x00' \
                  "origin/${{ github.base_ref }}..HEAD" | \
                python3 -c "
          import sys
          data = sys.stdin.read()
          bad = []
          for chunk in data.split('\x00END\x00'):
              chunk = chunk.strip('\x00\n')
              if not chunk:
                  continue
              sha, _, body = chunk.partition('\x00')
              if 'Signed-off-by:' not in body:
                  bad.append(sha)
          print(' '.join(bad))
          ")
          if [ -n "$bad" ]; then
            echo "Commits missing Signed-off-by: $bad"
            echo "Fix: git rebase --signoff origin/${{ github.base_ref }}, then force-push."
            exit 1
          fi
          echo "All commits signed off."

  # ---- Deployment: docs site on GitHub Pages --------------------------
  docs:
    name: Deploy docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
